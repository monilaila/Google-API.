<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d0b'/%3E%3Cpath d='M32 9l20 11.5v23L32 55 12 43.5v-23z' fill='none' stroke='%23d4a853' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><title>Orders</title>
<style>
:root{--bg:#0d0d0b;--bg2:#151513;--bg3:#1c1c1a;--surf:#222220;--ac:#d4a853;--tx:#e8e4dc;--tx2:#8a8580;--tx3:#4a4845;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);--red:#c94f4f;--grn:#4fa87a;--blu:#5b8fd4;--r:7px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'DM Sans',system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif}
.w{max-width:760px;margin:0 auto;padding:14px 12px 80px}.bar{display:flex;align-items:center;gap:8px;padding:6px 0 12px}.bar h1{font-size:17px;margin:0;flex:1;font-weight:700;color:var(--ac)}
button,.b{font:inherit;border:1px solid var(--bd2);background:var(--bg3);color:var(--tx);border-radius:var(--r);padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block;transition:background .15s,border-color .15s;position:relative}
button:hover,.b:hover{background:var(--surf);border-color:var(--ac)}.p{background:var(--ac);border-color:var(--ac);color:#0d0d0b;font-weight:600}.p:hover{background:var(--ac);filter:brightness(1.1)}.sm{padding:4px 9px;font-size:12px}.dg{color:#e58a8a}
.ld2{color:transparent!important}.ld2:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid rgba(0,0,0,.25);border-top-color:#888;border-radius:50%;animation:sp .7s linear infinite}.p.ld2:after{border-top-color:#0d0d0b}
.tabs{display:flex;gap:6px;align-items:center;padding-bottom:8px}.tabs .on{background:var(--ac);color:#0d0d0b;border-color:var(--ac);font-weight:600}.tabs i{font-style:normal;background:var(--red);color:#fff;border-radius:99px;padding:0 7px;font-size:11px;margin-left:5px}.tabs .hi{margin-left:auto;background:none;border:0;color:var(--tx2);font-size:12px;text-decoration:underline;padding:4px}.tabs .hi.on{color:var(--ac);background:none}
.c{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0}.c.new{border-color:var(--ac)}
.t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.t b{font-size:14px}.ag{color:var(--tx2);font-size:12px;flex:1}.ch{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surf);color:var(--tx2)}
.ch.Pending{background:rgba(212,168,83,.16);color:var(--ac)}.ch.Confirmed,.ch.Processing{background:rgba(91,143,212,.16);color:var(--blu)}.ch.Delayed{background:rgba(224,140,70,.16);color:#e08c46}.ch.Done,.ch.paid{background:rgba(79,168,122,.16);color:var(--grn)}.ch.Cancelled{background:rgba(201,79,79,.16);color:var(--red)}
.nm{font-size:16px;font-weight:700;margin:6px 0 0}.it{margin:4px 0;white-space:pre-line;color:var(--tx2)}.tt{font-size:16px;font-weight:700;color:var(--ac)}.pay{cursor:pointer;border:0;padding:3px 11px;font-size:12px;font-weight:600;border-radius:99px;background:rgba(201,79,79,.16);color:#e58a8a}.pay.paid{background:rgba(79,168,122,.18);color:var(--grn)}
.wa{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0;background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r);padding:8px}.wa .n{font-size:17px;font-weight:700;letter-spacing:.03em;flex:1;min-width:130px;user-select:all}
.ac{display:flex;gap:6px;flex-wrap:wrap}.dt{border-top:1px solid var(--bd);margin-top:10px;padding-top:8px}.ln{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--bd);word-break:break-word}.lb{color:var(--tx2);font-size:11px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--bd2);border-radius:var(--r);background:var(--bg);color:var(--tx)}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}.r2{display:flex;gap:6px;margin:6px 0}.r2>*{flex:1}
.m{padding:10px;border-radius:var(--r);margin:8px 0;background:rgba(212,168,83,.12);border:1px solid rgba(212,168,83,.3);color:var(--ac);font-size:13px}.e{background:rgba(201,79,79,.12);border-color:rgba(201,79,79,.35);color:#e58a8a}.mt{text-align:center;color:var(--tx2);padding:30px 0}.lg{text-align:center;padding:50px 12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ac);color:#0d0d0b;font-weight:600;border-radius:99px;padding:8px 16px;font-size:13px;display:none;z-index:60}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--ac),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:mv 1s linear infinite;display:none;z-index:50}@keyframes mv{from{background-position:-40% 0}to{background-position:140% 0}}
#ov{position:fixed;inset:0;background:rgba(13,13,11,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:40}#ov div{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--ac);border-radius:14px;padding:22px 30px;box-shadow:0 8px 30px rgba(0,0,0,.6);font-weight:600}
.sp{width:30px;height:30px;border:3px solid var(--tx3);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
body.busy #bar{display:block}body.busy #ov{display:flex}
.sk{height:120px;border-radius:10px;margin:10px 0;background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:sh 1.2s ease infinite}@keyframes sh{to{background-position:-200% 0}}
</style></head><body><div id="bar"></div><div id="ov"><div><span class="sp"></span><span id="ldt">Working...</span></div></div><div class="w" id="app"></div><div id="toast"></div>
<script>
var CFG={"cid":"583545653555-qc48sfb9402lbn94sd686mrdipddb2kk.apps.googleusercontent.com","url":"https://script.google.com/macros/s/AKfycbwbgUjjL8S5Q3nXfRO57tR2IKaxoSgYATYykiLvfup2biN4NO_9eeE9V9bhwMXqNf8S/exec","ver":3,"name":"Shop orders","shops":[{"id":"s_0zeh13","title":"Shop"}]},SK='sbd_'+CFG.cid.slice(0,10),st={sess:null,shop:CFG.shops[0].id,orders:[],next:0,tab:'new',open:{},msg:'',loaded:false,meta:null,set:false,sellers:null,last:0,tabSet:false};
function $(s){return document.querySelector(s)}
var busy=0;function setBusy(n,l){busy=Math.max(0,busy+n);if(l)$('#ldt').textContent=l;document.body.classList.toggle('busy',busy>0)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ld(){try{var j=JSON.parse(localStorage.getItem(SK)||'null');if(j&&j.code&&j.exp*1000>Date.now()+60000)return j}catch(e){}return null}
function sv(j){st.sess=j;try{j?localStorage.setItem(SK,JSON.stringify(j)):localStorage.removeItem(SK)}catch(e){}}
async function raw(p){var r=await fetch(CFG.url,{method:'POST',body:JSON.stringify(p)});return r.json()}
async function api(p,l){p.type='seller';p.shop=st.shop;p.sess=st.sess.code;var q=l!==null;if(q)setBusy(1,l||'Working...');try{var j=await raw(p);if(j&&(j.code==='NOT_SELLER'||j.code==='BAD_SESSION'||j.code==='EXPIRED')){sv(null);st.msg=j.error||'Please sign in again.';draw();throw new Error('auth')}return j}finally{if(q)setBusy(-1)}}
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},1400)}
function cp(v){try{navigator.clipboard.writeText(v).then(function(){toast('Copied')},function(){fb(v)})}catch(e){fb(v)}}
function fb(v){var t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copied')}catch(e){}t.remove()}
function grp(o){if(o.status==='Done'||o.status==='Cancelled')return 'hist';return o.isNew?'new':'queue'}
function cnt(g){return st.orders.filter(function(o){return grp(o)===g}).length}
function ago(s){var m=Math.max(0,Math.round((Date.now()-new Date(s).getTime())/60000));if(m<1)return 'just now';if(m<60)return m+' min ago';if(m<1440)return Math.round(m/60)+' h ago';return Math.round(m/1440)+' d ago'}
function pn(n){var d=String(n||'').replace(/[^0-9]/g,'');if(d.indexOf('880')===0)d='0'+d.slice(3);else if(d.length===10&&d.charAt(0)==='1')d='0'+d;return d}
function wnum(n){var d=String(n||'').replace(/[^0-9]/g,'');if(d.indexOf('880')===0)return d;if(d.charAt(0)==='0')return '88'+d;if(d.length===10&&d.charAt(0)==='1')return '880'+d;return d}
function msg(o){return 'Hello! Your order '+o.id+' ('+String(o.items||'').split('\n').join(', ')+') total '+o.currency+' '+o.total+' has been received.'}
function nm(o){var r='';String(o.details||'').split('\n').forEach(function(l){var i=l.indexOf(': ');if(!r&&i>0&&/name|নাম/i.test(l.slice(0,i)))r=l.slice(i+2)});return r}
function title(){var n=cnt('new');document.title=(n?'('+n+') ':'')+'Orders'}
function card(o){
 var g=grp(o),n=nm(o),h='<div class="c'+(g==='new'?' new':'')+'" data-id="'+esc(o.id)+'"><div class="t"><b>'+esc(o.id)+'</b><span class="ag">'+ago(o.created)+'</span><span class="ch '+esc(o.status)+'">'+esc(o.status)+'</span></div>';
 if(n&&!o.wiped)h+='<div class="nm">'+esc(n)+'</div>';
 h+='<div class="it">'+esc(o.items)+'</div><div class="t"><span class="tt">'+esc(o.currency)+' '+esc(o.total)+'</span>'+(g==='hist'?'<span class="ch '+esc(o.payStatus)+'">'+esc(o.payStatus||'unpaid')+'</span>':'<button class="pay '+(o.payStatus==='paid'?'paid':'')+'" data-a="pay" title="Tap to change">'+(o.payStatus==='paid'?'Paid':'Unpaid')+'</button>')+'</div>';
 if(o.wiped){h+='<div class="m">Personal data was removed (retention).</div>'}
 else{h+='<div class="wa"><span class="n">'+esc(pn(o.whatsapp))+'</span><button class="sm" data-a="cp" data-v="'+esc(pn(o.whatsapp))+'">Copy number</button><a class="b p sm" target="_blank" rel="noopener" href="https://wa.me/'+wnum(pn(o.whatsapp))+'?text='+encodeURIComponent(msg(o))+'" data-a="seen">WhatsApp</a></div>'}
 var A='';
 if(g==='new')A='<button class="p" data-a="st" data-s="Processing">Start processing</button><button data-a="gotit">Got it</button>';
 else if(g==='queue')A=o.status==='Processing'?'<button class="p" data-a="st" data-s="Done">Confirm</button><button class="dg" data-a="st" data-s="Cancelled">Cancel</button>':'<button class="p" data-a="st" data-s="Processing">Start processing</button><button class="dg" data-a="st" data-s="Cancelled">Cancel</button>';
 h+='<div class="ac">'+A+'<button data-a="more">'+(st.open[o.id]?'Less':'More')+'</button></div>';
 if(st.open[o.id]){
  h+='<div class="dt">';
  if(!o.wiped){h+='<div class="ln"><span><span class="lb">Email</span><br>'+esc(o.email)+'</span><button class="sm" data-a="cp" data-v="'+esc(o.email)+'">Copy</button></div>';
   String(o.details||'').split('\n').forEach(function(l){if(!l.trim())return;var i=l.indexOf(': '),k=i>0?l.slice(0,i):'',v=i>0?l.slice(i+2):l;h+='<div class="ln"><span><span class="lb">'+esc(k)+'</span><br>'+esc(v)+'</span><button class="sm" data-a="cp" data-v="'+esc(v)+'">Copy</button></div>'})}
  h+='<div class="r2"><select data-f="pay"><option value="unpaid"'+(o.payStatus==='unpaid'?' selected':'')+'>Unpaid</option><option value="pending"'+(o.payStatus==='pending'?' selected':'')+'>Payment pending</option><option value="paid"'+(o.payStatus==='paid'?' selected':'')+'>Paid</option></select><input data-f="ref" placeholder="Payment reference / TrxID" value="'+esc(o.payRef)+'"></div>';
  h+='<div class="r2"><select data-f="status">'+['Pending','Confirmed','Processing','Delayed','Done','Cancelled'].map(function(s){return '<option'+(s===o.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select><button data-a="stsel">Save status and payment</button></div>';
  h+='<textarea data-f="note" placeholder="Private note" rows="2">'+esc(o.notes)+'</textarea><div class="ac" style="margin-top:6px"><button data-a="note">Save note</button><button data-a="cp" data-v="'+esc(msg(o))+'">Copy message</button></div></div>'}
 return h+'</div>'}
function draw(){
 var a=$('#app'),h='';
 if(!st.sess){h='<div class="lg"><h1 style="color:var(--ac)">&#11041; '+esc(CFG.name)+'</h1><p>Seller sign-in</p><div id="g" style="display:inline-block"></div>'+(st.msg?'<div class="m e">'+esc(st.msg)+'</div>':'')+'<p class="lb" style="color:var(--tx2);font-size:12px">Only emails on the seller list can open this page.</p></div>';a.innerHTML=h;initG();return}
 h='<div class="bar"><h1>&#11041; '+esc(CFG.name)+'</h1>'+(CFG.shops.length>1?'<select id="shopsel" style="width:auto">'+CFG.shops.map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===st.shop?' selected':'')+'>'+esc(s.title)+'</option>'}).join('')+'</select>':'')+'<button data-a="ref">Refresh</button><button data-a="set">&#9881;</button></div>';
 if(st.msg)h+='<div class="m e">'+esc(st.msg)+'</div>';
 var m=st.meta;if(m){if(m.dashMin>CFG.ver)h+='<div class="m e">Update available: export or publish your site again from Site Builder.</div>';if(m.triggerOk===false)h+='<div class="m">Daily cleanup is not set up. Run setupTrigger once in Apps Script (customer data is still cleaned when orders arrive).</div>'}
 if(st.set){h+='<div class="c"><b>Settings</b><p class="lb">Signed in as '+esc(st.email)+'</p><div class="ac"><button data-a="clean">Clean up now</button><button data-a="logall">Sign out all sellers</button><button data-a="out">Log out and forget this device</button></div><div class="m">On a shared computer always log out.</div><b>Sellers</b>';
  (st.sellers||[]).forEach(function(e){h+='<div class="ln"><span>'+esc(e)+(e===st.owner?' (owner)':'')+'</span>'+(e===st.owner?'':'<button class="sm" data-a="rmsel" data-v="'+esc(e)+'">Remove</button>')+'</div>'});
  h+='<div class="r2"><input id="newsel" type="email" placeholder="New seller email"><button data-a="addsel">Add</button></div></div>'}
 var T=[['new','New'],['queue','To process'],['hist','Finished']];
 h+='<div class="tabs">'+T.map(function(t){var n=cnt(t[0]);return '<button class="'+(st.tab===t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'">'+t[1]+(n&&t[0]!=='hist'?'<i>'+n+'</i>':'')+'</button>'}).join('')+'</div>';
 var L=st.orders.filter(function(o){return grp(o)===st.tab});
 L.sort(function(x,y){var d=new Date(x.created)-new Date(y.created);return st.tab==='hist'?-d:d});if(st.tab==='hist')L=L.slice(0,30);
 h+=L.length?L.map(card).join(''):(st.loaded?'<div class="mt">'+(st.tab==='new'?'No new orders.':st.tab==='hist'?'No finished orders yet.':'Nothing to process.')+'</div>':'<div class="sk"></div><div class="sk"></div><div class="sk"></div>');
 if(st.next)h+='<div style="text-align:center"><button data-a="more2">Load older orders</button></div>';
 a.innerHTML=h;title()}
function initG(){if(!window.google||!google.accounts){return setTimeout(initG,300)}
 google.accounts.id.initialize({client_id:CFG.cid,callback:onCred,auto_select:false});var g=$('#g');if(g)google.accounts.id.renderButton(g,{theme:'outline',size:'large'})}
async function onCred(r){st.msg='';setBusy(1,'Signing in...');try{var j=await raw({type:'session',token:r.credential,want:'seller'});if(j&&j.ok){sv({code:j.sess,exp:j.expires,email:j.email});start()}else{st.msg=(j&&j.error)||'Could not sign in.'}}catch(e){st.msg='Could not reach the shop script.'}setBusy(-1);draw()}
async function refresh(){if(!st.sess)return;try{var j=await api({action:'list',limit:50},'Loading orders...');if(j.ok){st.orders=j.orders;st.next=j.next;st.email=j.email;st.owner=j.owner;st.loaded=true;st.msg='';if(!st.tabSet){st.tab=cnt('new')?'new':'queue';st.tabSet=true}}else st.msg=j.error||'Error'}catch(e){if(e.message!=='auth')st.msg='Could not reach the shop script.'}st.last=Date.now();draw()}
async function start(){st.tabSet=false;draw();try{var r=await fetch(CFG.url+'?type=ping');st.meta=await r.json()}catch(e){}refresh()}
function find(el){var c=el.closest('[data-id]');if(!c)return null;var id=c.getAttribute('data-id');return {c:c,o:st.orders.filter(function(x){return x.id===id})[0]}}
async function setSt(o,s,pay,ref,lab){if(s==='Cancelled'&&!confirm('Cancel this order?'))return;try{var j=await api({action:'status',orderId:o.id,status:s,payStatus:pay,payRef:ref},lab||'Saving...');if(j.ok){o.status=s;o.isNew=false;if(pay)o.payStatus=pay;if(ref!==undefined)o.payRef=ref;toast('Saved');draw()}else toast(j.error||'Error')}catch(e){}}
var LOAD={st:1,stsel:1,pay:1,gotit:1,note:1,ref:1,more2:1,clean:1,addsel:1,rmsel:1};
document.addEventListener('click',async function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a'),v=b.getAttribute('data-v'),f=find(b),o=f&&f.o;
 if(busy>0&&a!=='cp'&&a!=='tab')return;
 if(LOAD[a])b.classList.add('ld2');
 if(a==='cp'){cp(v);if(o&&o.isNew){api({action:'seen',orderId:o.id},null);o.isNew=false}}
 else if(a==='seen'&&o&&o.isNew){api({action:'seen',orderId:o.id},null);o.isNew=false;setTimeout(draw,300)}
 else if(a==='tab'){st.tab=v;draw()}
 else if(a==='more'&&o){st.open[o.id]=!st.open[o.id];draw()}
 else if(a==='gotit'&&o){var j0=await api({action:'seen',orderId:o.id},'Moving to queue...');if(j0.ok)o.isNew=false;draw()}
 else if(a==='pay'&&o){setSt(o,o.status,o.payStatus==='paid'?'unpaid':'paid',undefined,'Updating payment...')}
 else if(a==='st'&&o){var s=b.getAttribute('data-s');setSt(o,s,undefined,undefined,s==='Done'?'Confirming order...':s==='Cancelled'?'Cancelling order...':'Starting process...')}
 else if(a==='stsel'&&o){setSt(o,f.c.querySelector('[data-f=status]').value,f.c.querySelector('[data-f=pay]').value,f.c.querySelector('[data-f=ref]').value)}
 else if(a==='note'&&o){var j=await api({action:'note',orderId:o.id,text:f.c.querySelector('[data-f=note]').value},'Saving note...');if(j.ok){o.notes=f.c.querySelector('[data-f=note]').value;toast('Note saved')}draw()}
 else if(a==='ref'){refresh()}
 else if(a==='more2'){var j2=await api({action:'list',limit:50,before:st.next},'Loading older orders...');if(j2.ok){st.orders=st.orders.concat(j2.orders);st.next=j2.next}draw()}
 else if(a==='set'){st.set=!st.set;if(st.set&&!st.sellers){var s2=await api({action:'sellers'},'Loading sellers...');st.sellers=s2.sellers;st.owner=s2.owner}draw()}
 else if(a==='clean'){var c=await api({action:'cleanup'},'Cleaning up old data...');toast('Cleaned '+(c.wiped||0)+' orders');draw()}
 else if(a==='logall'){if(confirm('Sign out every seller on every device?')){await api({action:'logout'},'Signing out...');sv(null);draw()}}
 else if(a==='out'){sv(null);st.orders=[];st.loaded=false;st.set=false;draw()}
 else if(a==='addsel'){var em=$('#newsel').value;var r=await api({action:'sellers',op:'add',email:em},'Adding seller...');st.sellers=r.sellers;draw()}
 else if(a==='rmsel'){var r2=await api({action:'sellers',op:'remove',email:v},'Removing seller...');st.sellers=r2.sellers;draw()}
});
document.addEventListener('change',function(e){if(e.target.id==='shopsel'){st.shop=e.target.value;st.orders=[];st.loaded=false;st.tabSet=false;draw();refresh()}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&st.sess&&Date.now()-st.last>60000)refresh()});
(function(){var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;document.head.appendChild(s);st.sess=ld();if(st.sess)start();else draw()})();</script></body></html>
