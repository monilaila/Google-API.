<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Orders</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--tx2:#5b6472;--bd:#e3e6eb;--ac:#0f766e;--ac2:#e6f4f2;--red:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--tx:#eef1f5;--tx2:#9aa4b2;--bd:#262d37;--ac:#2dd4bf;--ac2:#12302d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif}
.w{max-width:760px;margin:0 auto;padding:12px 12px 80px}.bar{display:flex;align-items:center;gap:8px;padding:6px 0 10px}.bar h1{font-size:18px;margin:0;flex:1}
button,.b{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.sm{padding:4px 9px;font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.tabs button{white-space:nowrap}.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}.tabs i{font-style:normal;background:#ef4444;color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:4px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}.c.new{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac2)}
.t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.t b{font-size:15px}.ag{color:var(--tx2);font-size:12px;flex:1}.ch{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bd)}
.ch.Pending{background:#fef3c7;color:#92400e}.ch.Confirmed,.ch.Processing{background:#dbeafe;color:#1e40af}.ch.Delayed{background:#ffedd5;color:#9a3412}.ch.Done,.ch.paid{background:#dcfce7;color:#166534}.ch.Cancelled{background:#fee2e2;color:#991b1b}
.it{margin:6px 0;white-space:pre-line}.tt{font-size:17px;font-weight:700}.wa{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0;background:var(--ac2);border-radius:10px;padding:8px}.wa .n{font-size:17px;font-weight:700;letter-spacing:.03em;flex:1;min-width:130px;user-select:all}
.ac{display:flex;gap:6px;flex-wrap:wrap}.dt{border-top:1px solid var(--bd);margin-top:10px;padding-top:8px}.ln{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--bd);word-break:break-word}.lb{color:var(--tx2);font-size:12px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}.r2{display:flex;gap:6px;margin:6px 0}.r2>*{flex:1}
.m{padding:10px;border-radius:10px;margin:8px 0;background:#fef3c7;color:#92400e;font-size:13px}.e{background:#fee2e2;color:#991b1b}.mt{text-align:center;color:var(--tx2);padding:30px 0}.lg{text-align:center;padding:40px 12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;border-radius:99px;padding:8px 16px;font-size:13px;display:none}
</style></head><body><div class="w" id="app"></div><div id="toast"></div>
<script>
var CFG={"cid":"583545653555-qc48sfb9402lbn94sd686mrdipddb2kk.apps.googleusercontent.com","url":"https://script.google.com/macros/s/AKfycbwbgUjjL8S5Q3nXfRO57tR2IKaxoSgYATYykiLvfup2biN4NO_9eeE9V9bhwMXqNf8S/exec","ver":1,"name":"Shop orders","shops":[{"id":"s_0zeh13","title":"Shop"}]},SK='sbd_'+CFG.cid.slice(0,10),st={sess:null,shop:CFG.shops[0].id,orders:[],next:0,tab:'new',open:{},msg:'',loaded:false,meta:null,set:false,sellers:null,last:0,tabSet:false};
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ld(){try{var j=JSON.parse(localStorage.getItem(SK)||'null');if(j&&j.code&&j.exp*1000>Date.now()+60000)return j}catch(e){}return null}
function sv(j){st.sess=j;try{j?localStorage.setItem(SK,JSON.stringify(j)):localStorage.removeItem(SK)}catch(e){}}
async function raw(p){var r=await fetch(CFG.url,{method:'POST',body:JSON.stringify(p)});return r.json()}
async function api(p){p.type='seller';p.shop=st.shop;p.sess=st.sess.code;var j=await raw(p);if(j&&(j.code==='NOT_SELLER'||j.code==='BAD_SESSION'||j.code==='EXPIRED')){sv(null);st.msg=j.error||'Please sign in again.';draw();throw new Error('auth')}return j}
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},1400)}
function cp(v){try{navigator.clipboard.writeText(v).then(function(){toast('Copied')},function(){fb(v)})}catch(e){fb(v)}}
function fb(v){var t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copied')}catch(e){}t.remove()}
function grp(o){if(o.status==='Done'||o.status==='Cancelled')return 'closed';if(o.isNew)return 'new';if(o.status==='Pending')return 'pending';return 'active'}
function cnt(g){return st.orders.filter(function(o){return grp(o)===g}).length}
function ago(s){var m=Math.max(0,Math.round((Date.now()-new Date(s).getTime())/60000));if(m<1)return 'just now';if(m<60)return m+' min ago';if(m<1440)return Math.round(m/60)+' h ago';return Math.round(m/1440)+' d ago'}
function wnum(n){var d=String(n||'').replace(/[^0-9]/g,'');if(d.indexOf('880')===0)return d;if(d.charAt(0)==='0')return '88'+d;if(d.length===10&&d.charAt(0)==='1')return '880'+d;return d}
function msg(o){return 'Hello! Your order '+o.id+' ('+String(o.items||'').split('\n').join(', ')+') total '+o.currency+' '+o.total+' has been received.'}
function title(){var n=cnt('new');document.title=(n?'('+n+') ':'')+'Orders'}
function card(o){
 var g=grp(o),h='<div class="c'+(g==='new'?' new':'')+'" data-id="'+esc(o.id)+'"><div class="t"><b>'+esc(o.id)+'</b><span class="ag">'+ago(o.created)+'</span><span class="ch '+esc(o.status)+'">'+esc(o.status)+'</span></div>';
 h+='<div class="it">'+esc(o.items)+'</div><div class="t"><span class="tt">'+esc(o.currency)+' '+esc(o.total)+'</span><span class="ch '+esc(o.payStatus)+'">'+esc(o.payStatus||'unpaid')+'</span></div>';
 if(o.wiped){h+='<div class="m">Personal data was removed (retention).</div>'}
 else{h+='<div class="wa"><span class="n">'+esc(o.whatsapp)+'</span><button class="sm" data-a="cp" data-v="'+esc(o.whatsapp)+'">Copy number</button><a class="b p sm" target="_blank" rel="noopener" href="https://wa.me/'+wnum(o.whatsapp)+'?text='+encodeURIComponent(msg(o))+'" data-a="seen">WhatsApp</a></div>'}
 var nx={Pending:['Confirmed','Confirm order'],Confirmed:['Processing','Start processing'],Processing:['Done','Mark done'],Delayed:['Done','Mark done']}[o.status];
 h+='<div class="ac">'+(nx?'<button class="p" data-a="st" data-s="'+nx[0]+'">'+nx[1]+'</button>':'')+'<button data-a="more">'+(st.open[o.id]?'Less':'More')+'</button></div>';
 if(st.open[o.id]){
  h+='<div class="dt">';
  if(!o.wiped){h+='<div class="ln"><span><span class="lb">Email</span><br>'+esc(o.email)+'</span><button class="sm" data-a="cp" data-v="'+esc(o.email)+'">Copy</button></div>';
   String(o.details||'').split('\n').forEach(function(l){if(!l.trim())return;var i=l.indexOf(': '),k=i>0?l.slice(0,i):'',v=i>0?l.slice(i+2):l;h+='<div class="ln"><span><span class="lb">'+esc(k)+'</span><br>'+esc(v)+'</span><button class="sm" data-a="cp" data-v="'+esc(v)+'">Copy</button></div>'})}
  h+='<div class="r2"><select data-f="pay"><option value="unpaid"'+(o.payStatus==='unpaid'?' selected':'')+'>Unpaid</option><option value="pending"'+(o.payStatus==='pending'?' selected':'')+'>Payment pending</option><option value="paid"'+(o.payStatus==='paid'?' selected':'')+'>Paid</option></select><input data-f="ref" placeholder="Payment reference / TrxID" value="'+esc(o.payRef)+'"></div>';
  h+='<div class="r2"><select data-f="status">'+['Pending','Confirmed','Processing','Delayed','Done','Cancelled'].map(function(s){return '<option'+(s===o.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select><button data-a="stsel">Save status and payment</button></div>';
  h+='<textarea data-f="note" placeholder="Private note" rows="2">'+esc(o.notes)+'</textarea><div class="ac" style="margin-top:6px"><button data-a="note">Save note</button><button data-a="cp" data-v="'+esc(msg(o))+'">Copy message</button></div></div>'}
 return h+'</div>'}
function draw(){
 var a=$('#app'),h='';
 if(!st.sess){h='<div class="lg"><h1>'+esc(CFG.name)+'</h1><p>Seller sign-in</p><div id="g" style="display:inline-block"></div>'+(st.msg?'<div class="m e">'+esc(st.msg)+'</div>':'')+'<p class="lb" style="color:var(--tx2);font-size:12px">Only emails on the seller list can open this page.</p></div>';a.innerHTML=h;initG();return}
 h='<div class="bar"><h1>'+esc(CFG.name)+'</h1>'+(CFG.shops.length>1?'<select id="shopsel" style="width:auto">'+CFG.shops.map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===st.shop?' selected':'')+'>'+esc(s.title)+'</option>'}).join('')+'</select>':'')+'<button data-a="ref">Refresh</button><button data-a="set">&#9881;</button></div>';
 if(st.msg)h+='<div class="m e">'+esc(st.msg)+'</div>';
 var m=st.meta;if(m){if(m.dashMin>CFG.ver)h+='<div class="m e">Update available: regenerate this page in Site Builder and upload it again.</div>';if(m.triggerOk===false)h+='<div class="m">Daily cleanup is not set up. Run setupTrigger once in Apps Script (customer data is still cleaned when orders arrive).</div>'}
 if(st.set){h+='<div class="c"><b>Settings</b><p class="lb">Signed in as '+esc(st.email)+'</p><div class="ac"><button data-a="clean">Clean up now</button><button data-a="logall">Sign out all sellers</button><button data-a="out">Log out and forget this device</button></div><div class="m">On a shared computer always log out.</div><b>Sellers</b>';
  (st.sellers||[]).forEach(function(e){h+='<div class="ln"><span>'+esc(e)+(e===st.owner?' (owner)':'')+'</span>'+(e===st.owner?'':'<button class="sm" data-a="rmsel" data-v="'+esc(e)+'">Remove</button>')+'</div>'});
  h+='<div class="r2"><input id="newsel" type="email" placeholder="New seller email"><button data-a="addsel">Add</button></div></div>'}
 var T=[['new','New'],['pending','To confirm'],['active','In progress'],['closed','Closed']];
 h+='<div class="tabs">'+T.map(function(t){var n=cnt(t[0]);return '<button class="'+(st.tab===t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'">'+t[1]+(n&&t[0]!=='closed'?'<i>'+n+'</i>':'')+'</button>'}).join('')+'</div>';
 var L=st.orders.filter(function(o){return grp(o)===st.tab});
 h+=L.length?L.map(card).join(''):'<div class="mt">'+(st.loaded?'Nothing here.':'Loading...')+'</div>';
 if(st.next)h+='<div style="text-align:center"><button data-a="more2">Load older orders</button></div>';
 a.innerHTML=h;title()}
function initG(){if(!window.google||!google.accounts){return setTimeout(initG,300)}
 google.accounts.id.initialize({client_id:CFG.cid,callback:onCred,auto_select:false});var g=$('#g');if(g)google.accounts.id.renderButton(g,{theme:'outline',size:'large'})}
async function onCred(r){st.msg='';try{var j=await raw({type:'session',token:r.credential,want:'seller'});if(j&&j.ok){sv({code:j.sess,exp:j.expires,email:j.email});start()}else{st.msg=(j&&j.error)||'Could not sign in.'}}catch(e){st.msg='Could not reach the shop script.'}draw()}
async function refresh(){if(!st.sess)return;try{var j=await api({action:'list',limit:50});if(j.ok){st.orders=j.orders;st.next=j.next;st.email=j.email;st.owner=j.owner;st.loaded=true;st.msg='';if(!st.tabSet){st.tab=cnt('new')?'new':(cnt('pending')?'pending':'active');st.tabSet=true}}else st.msg=j.error||'Error'}catch(e){if(e.message!=='auth')st.msg='Could not reach the shop script.'}st.last=Date.now();draw()}
async function start(){st.tabSet=false;draw();try{var r=await fetch(CFG.url+'?type=ping');st.meta=await r.json()}catch(e){}refresh()}
function find(el){var c=el.closest('[data-id]');if(!c)return null;var id=c.getAttribute('data-id');return {c:c,o:st.orders.filter(function(x){return x.id===id})[0]}}
async function setSt(o,s,pay,ref){if(s==='Cancelled'&&!confirm('Cancel this order?'))return;try{var j=await api({action:'status',orderId:o.id,status:s,payStatus:pay,payRef:ref});if(j.ok){o.status=s;o.isNew=false;if(pay)o.payStatus=pay;if(ref!==undefined)o.payRef=ref;toast('Saved');draw()}else toast(j.error||'Error')}catch(e){}}
document.addEventListener('click',async function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a'),v=b.getAttribute('data-v'),f=find(b),o=f&&f.o;
 if(a==='cp'){cp(v);if(o&&o.isNew){api({action:'seen',orderId:o.id});o.isNew=false}}
 else if(a==='seen'&&o&&o.isNew){api({action:'seen',orderId:o.id});o.isNew=false;setTimeout(draw,300)}
 else if(a==='tab'){st.tab=v;draw()}
 else if(a==='more'&&o){st.open[o.id]=!st.open[o.id];if(o.isNew){api({action:'seen',orderId:o.id});o.isNew=false}draw()}
 else if(a==='st'&&o){setSt(o,b.getAttribute('data-s'))}
 else if(a==='stsel'&&o){setSt(o,f.c.querySelector('[data-f=status]').value,f.c.querySelector('[data-f=pay]').value,f.c.querySelector('[data-f=ref]').value)}
 else if(a==='note'&&o){var j=await api({action:'note',orderId:o.id,text:f.c.querySelector('[data-f=note]').value});if(j.ok){o.notes=f.c.querySelector('[data-f=note]').value;toast('Note saved')}}
 else if(a==='ref'){refresh()}
 else if(a==='more2'){var j2=await api({action:'list',limit:50,before:st.next});if(j2.ok){st.orders=st.orders.concat(j2.orders);st.next=j2.next;draw()}}
 else if(a==='set'){st.set=!st.set;if(st.set&&!st.sellers){var s=await api({action:'sellers'});st.sellers=s.sellers;st.owner=s.owner}draw()}
 else if(a==='clean'){var c=await api({action:'cleanup'});toast('Cleaned '+(c.wiped||0)+' orders')}
 else if(a==='logall'){if(confirm('Sign out every seller on every device?')){await api({action:'logout'});sv(null);draw()}}
 else if(a==='out'){sv(null);st.orders=[];st.loaded=false;st.set=false;draw()}
 else if(a==='addsel'){var em=$('#newsel').value;var r=await api({action:'sellers',op:'add',email:em});st.sellers=r.sellers;draw()}
 else if(a==='rmsel'){var r2=await api({action:'sellers',op:'remove',email:v});st.sellers=r2.sellers;draw()}
});
document.addEventListener('change',function(e){if(e.target.id==='shopsel'){st.shop=e.target.value;st.orders=[];st.loaded=false;st.tabSet=false;draw();refresh()}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&st.sess&&Date.now()-st.last>60000)refresh()});
(function(){var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;document.head.appendChild(s);st.sess=ld();if(st.sess)start();else draw()})();</script></body></html>
