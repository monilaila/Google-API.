<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Sign-In Test</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --bg:#0f0e0c; --bg2:#1a1916; --surf:#2a2926; --txt:#f0ede6; --txt2:#a09a8f; --acc:#d4a853; --ok:#6fcf97; --err:#eb5757; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.5; }
  main { max-width:560px; margin:0 auto; padding:2.5rem 1.25rem; }
  h1 { font-family:Georgia,serif; font-size:1.8rem; margin:0 0 .25rem; }
  .sub { color:var(--txt2); margin:0 0 1.5rem; font-size:.95rem; }
  .card { background:var(--bg2); border:1px solid var(--surf); border-radius:12px; padding:1.25rem; margin-bottom:1rem; }
  .card h2 { font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); margin:0 0 .9rem; }
  .who { display:flex; align-items:center; gap:.75rem; }
  .who img { width:44px; height:44px; border-radius:50%; background:var(--surf); }
  .who b { display:block; }
  .who span { color:var(--txt2); font-size:.9rem; }
  textarea { width:100%; min-height:110px; background:var(--bg); color:var(--txt); border:1px solid var(--surf); border-radius:8px; padding:.7rem; font:inherit; resize:vertical; }
  textarea:focus { outline:2px solid var(--acc); border-color:transparent; }
  button { margin-top:.75rem; background:var(--acc); color:#1a1916; border:0; border-radius:8px; padding:.7rem 1.2rem; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  button.ghost { background:transparent; color:var(--txt2); border:1px solid var(--surf); margin-left:.5rem; }
  #status { margin-top:.9rem; font-size:.92rem; min-height:1.4em; word-break:break-word; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .warn { background:#3a2a14; border:1px solid var(--acc); color:var(--txt); border-radius:8px; padding:.7rem .9rem; font-size:.9rem; margin-bottom:1rem; }
  code { background:var(--surf); padding:.1rem .35rem; border-radius:4px; font-size:.85em; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Google Sign-In Test</h1>
  <p class="sub">Sign in, write a message, and check that it lands in Google Sheets with your verified email.</p>

  <div id="configWarn" class="warn" hidden></div>

  <div class="card" id="stepSignin">
    <h2>1 · Sign in</h2>
    <div id="gbtn"></div>
    <p class="sub" style="margin:.9rem 0 0;font-size:.85rem">This page's origin: <code id="origin"></code><br>It must be listed in the Client ID's Authorized JavaScript origins.</p>
  </div>

  <div class="card" id="stepMessage" hidden>
    <h2>2 · Write a message</h2>
    <div class="who">
      <img id="pic" alt="" referrerpolicy="no-referrer">
      <div><b id="name"></b><span id="email"></span></div>
    </div>
    <textarea id="msg" maxlength="1000" placeholder="Write a test review..." style="margin-top:1rem"></textarea>
    <button id="send">Send to Google Sheets</button>
    <button id="signout" class="ghost">Sign out</button>
    <div id="status"></div>
  </div>
</main>

<script>
(function () {
  // ======== PASTE YOUR VALUES HERE ========
  var CLIENT_ID  = "PASTE_YOUR_CLIENT_ID.apps.googleusercontent.com";
  var SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_/exec_URL";
  // ========================================

  var idToken = null;
  var $ = function (id) { return document.getElementById(id); };

  $("origin").textContent = location.origin;

  var missing = [];
  if (CLIENT_ID.indexOf("PASTE_") === 0) missing.push("CLIENT_ID");
  if (SCRIPT_URL.indexOf("PASTE_") === 0) missing.push("SCRIPT_URL");
  if (missing.length) {
    $("configWarn").hidden = false;
    $("configWarn").textContent = "Still needs setup: " + missing.join(" and ") + " (edit the top of the script in index.html).";
  }

  function parseJwt(token) {
    var b64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    var json = decodeURIComponent(atob(b64).split("").map(function (c) {
      return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(""));
    return JSON.parse(json);
  }

  function setStatus(text, cls) {
    var s = $("status");
    s.textContent = text;
    s.className = cls || "";
  }

  function onCredential(resp) {
    idToken = resp.credential;
    // Display only. The server re-verifies the token itself.
    var p = parseJwt(idToken);
    $("name").textContent = p.name || "";
    $("email").textContent = p.email || "";
    $("pic").src = p.picture || "";
    $("stepSignin").hidden = true;
    $("stepMessage").hidden = false;
    setStatus("");
  }

  function init() {
    if (!window.google || !google.accounts) {
      setTimeout(init, 200);
      return;
    }
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential });
    google.accounts.id.renderButton($("gbtn"), { theme: "filled_black", size: "large", text: "signin_with" });
  }
  window.addEventListener("load", init);

  $("signout").addEventListener("click", function () {
    if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
    idToken = null;
    $("stepMessage").hidden = true;
    $("stepSignin").hidden = false;
  });

  $("send").addEventListener("click", function () {
    var message = $("msg").value.trim();
    if (!idToken) { setStatus("Please sign in first.", "err"); return; }
    if (!message) { setStatus("Write a message first.", "err"); return; }

    var btn = $("send");
    btn.disabled = true;
    setStatus("Sending...");

    // No custom headers, so the browser sends a "simple" request (no CORS preflight),
    // which is what Apps Script web apps need.
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ token: idToken, message: message })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          setStatus("Saved. Verified email " + data.email + " written to row " + data.row + " of the \"" + data.sheet + "\" sheet.", "ok");
          $("msg").value = "";
        } else {
          setStatus("Server said: " + data.error, "err");
        }
      })
      .catch(function (e) {
        setStatus("Request failed: " + e.message + " (check SCRIPT_URL and that the deployment access is \"Anyone\").", "err");
      })
      .finally(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
